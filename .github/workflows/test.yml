name: Guardian CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python unit and HTTP tests
        run: python3 -m unittest discover -s tests -v
      - name: Bytecode syntax
        run: python3 -m compileall -q guardian tests
      - name: JS syntax
        run: node --check guardian/static/app.js
